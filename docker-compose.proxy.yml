# Behind an existing reverse proxy that already serves HTTPS on ports 80/443 (e.g. Nginx
# Proxy Manager): the web container publishes no port, serves plain HTTP and joins the
# proxy's Docker network, where the proxy reaches it at http://identity-web:80.
# Enabled from .env (see .env.example):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   PROXY_NETWORK=<the proxy's Docker network>
services:
  web:
    ports: !reset []
    environment:
      SITE_ADDRESS: ':8080'
      # The proxy's X-Forwarded-For then gives the visitor's IP (sign-in rate limits).
      TRUSTED_PROXIES: private_ranges
    networks:
      default:
      proxy:
        aliases:
          - identity-web

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env (the reverse proxy's Docker network)}
